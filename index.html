<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Uche’s Hub Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--or:#F28C28;--ord:#D9731A;--alt:#FFF7EE;--ink:#1E1B18;--soft:#6B645C;--line:#EDE3D6}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--alt);color:var(--ink);padding-bottom:96px}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.top b{font-size:1.1rem}.top i{color:var(--or);font-style:normal}
.link{background:none;border:0;color:var(--soft);font-weight:600}
.tabs{display:flex;gap:8px;padding:12px 16px}
.tabs button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700}
.tabs .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.box{padding:0 16px 16px}
.row{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:12px;margin-bottom:10px}
.row.dim{opacity:.6}
.row img{width:72px;height:90px;object-fit:cover;border-radius:10px;background:#F6E9D8;flex:none}
.m{flex:1;min-width:0}.m span{display:block;color:var(--soft);font-size:.82rem;margin:2px 0 8px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts button{padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:.82rem;font-weight:600}
.acts .d{color:#B3261E}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--or);color:#fff;border:0;border-radius:30px;padding:15px 24px;font-weight:800;box-shadow:0 8px 20px rgba(242,140,40,.4)}
.pri{width:100%;background:var(--or);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:800;margin-top:6px}
.pri:disabled{opacity:.5}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
#login{min-height:100vh;display:flex;align-items:center;padding:20px}
#login .card{width:100%;max-width:380px;margin:0 auto}
#login h1{font-size:1.5rem;margin-bottom:4px}#login p{color:var(--soft);margin-bottom:16px}
label{display:block;font-weight:700;font-size:.85rem;margin:12px 0 5px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.err{color:#B3261E;font-size:.88rem;margin-top:10px;min-height:1.2em}
.sheet{position:fixed;inset:0;background:rgba(30,20,10,.5);z-index:20;display:flex;align-items:flex-end}
.sh{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sh h2{margin-bottom:4px}
.ph{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.ph div{width:86px;text-align:center}
.ph img{width:86px;height:108px;object-fit:cover;border-radius:10px;display:block}
.ph button{border:1px solid var(--line);background:#fff;border-radius:8px;width:26px;height:26px;margin:4px 1px 0}
.add{border:2px dashed var(--or);color:var(--ord);background:#FFF7EE;border-radius:12px;padding:12px;width:100%;font-weight:700}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.nums .card{padding:12px;text-align:center}.nums b{display:block;font-size:1.6rem;color:var(--ord)}.nums span{font-size:.75rem;color:var(--soft)}
.bar{display:flex;align-items:center;gap:8px;font-size:.82rem;margin:6px 0}.bar i{display:block;height:12px;background:var(--or);border-radius:6px;min-width:2px}.bar em{width:56px;font-style:normal;color:var(--soft)}
.tp{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.tp:last-child{border:0}
.card h3{margin-bottom:6px}.card+.card{margin-top:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:.88rem;z-index:50}
</style></head><body>

<div id="login" hidden><div class="card">
<h1>Uche’s<i style="color:#F28C28;font-style:normal">Hub</i> Dashboard</h1><p>Owner login</p>
<label for="em">Email</label><input id="em" type="email" autocomplete="username">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<button class="pri" id="go">Log in</button><div class="err" id="err"></div>
</div></div>

<div id="app" hidden>
<div class="top"><b>Uche’s<i>Hub</i></b><button class="link" id="out">Log out</button></div>
<div class="tabs"><button class="on" id="t1">Products</button><button id="t2">Stats</button></div>
<div class="box" id="plist"></div>
<div class="box" id="st" hidden></div>
<button class="fab" id="new">+ Add product</button>
</div>

<div class="sheet" id="sheet" hidden><div class="sh">
<h2 id="shT">Add product</h2>
<label for="fn">Name</label><input id="fn" placeholder="e.g. Cross Buckle Shirt">
<label for="fp">Price (₦)</label><input id="fp" type="number" inputmode="numeric" placeholder="20000">
<label for="fc">Category</label><select id="fc"><option value="shirts">Shirts</option><option value="jeans">Jeans</option><option value="gowns">Gowns</option><option value="sneakers">Sneakers</option><option value="other">Other</option></select>
<label>Photos (each photo is one colour)</label>
<div class="ph" id="ph"></div>
<input id="file" type="file" accept="image/*" multiple hidden>
<button class="add" id="addph">+ Add photos</button>
<button class="pri" id="save">Save product</button>
<button class="link" id="cancel" style="width:100%;margin-top:8px">Cancel</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
var API="https://wcguwbhmhgisxtsyzqvz.supabase.co",KEY="sb_publishable_R1e56zaniayxy_dldZNRcg_FsZBrjFv";
var sb=supabase.createClient(API,KEY),$=function(s){return document.querySelector(s)};
var list=[],editId=null,imgs=[];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){var t=document.createElement('div');t.id='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function show(on){$('#login').hidden=on;$('#app').hidden=!on;if(on)load()}
sb.auth.getSession().then(function(r){show(!!r.data.session)});
$('#go').onclick=async function(){$('#err').textContent='';var r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(r.error)$('#err').textContent='Could not log in: '+r.error.message;else show(true)};
$('#out').onclick=async function(){await sb.auth.signOut();show(false)};
$('#t1').onclick=function(){tab(1)};$('#t2').onclick=function(){tab(2);stats()};
function tab(n){$('#t1').classList.toggle('on',n===1);$('#t2').classList.toggle('on',n===2);$('#plist').hidden=n!==1;$('#st').hidden=n!==2;$('#new').hidden=n!==1}

async function load(){var r=await sb.from('products').select('*').order('sort_order');if(r.error){toast(r.error.message);return}list=r.data;render()}
function render(){
$('#plist').innerHTML=list.length?list.map(function(p,i){return '<div class="row'+(p.hidden?' dim':'')+'"><img src="'+esc(p.images[0]||'')+'" alt=""><div class="m"><b>'+esc(p.name)+'</b><span>₦'+p.price.toLocaleString('en-NG')+' · '+p.images.length+' colour'+(p.images.length===1?'':'s')+(p.hidden?' · Hidden':'')+(p.sold_out?' · Sold out':'')+'</span><div class="acts">'+
'<button data-a="edit" data-i="'+i+'">Edit</button><button data-a="up" data-i="'+i+'">↑</button><button data-a="down" data-i="'+i+'">↓</button>'+
'<button data-a="hide" data-i="'+i+'">'+(p.hidden?'Show':'Hide')+'</button><button data-a="sold" data-i="'+i+'">'+(p.sold_out?'In stock':'Sold out')+'</button><button class="d" data-a="del" data-i="'+i+'">Delete</button></div></div></div>'}).join(''):'<div class="card">No products yet. Tap “Add product” to start.</div>'}
$('#plist').onclick=async function(e){var b=e.target.closest('button');if(!b)return;var i=+b.dataset.i,p=list[i],a=b.dataset.a;
if(a==='edit')return openForm(p);
if(a==='hide'||a==='sold'){var f=a==='hide'?{hidden:!p.hidden}:{sold_out:!p.sold_out};var r=await sb.from('products').update(f).eq('id',p.id);if(r.error)return toast(r.error.message);toast('Saved');return load()}
if(a==='up'||a==='down'){var j=a==='up'?i-1:i+1;if(j<0||j>=list.length)return;var x=list.splice(i,1)[0];list.splice(j,0,x);
var rs=await Promise.all(list.map(function(q,k){return sb.from('products').update({sort_order:k+1}).eq('id',q.id)}));if(rs.some(function(r){return r.error}))toast('Could not reorder');return load()}
if(a==='del'&&confirm('Delete '+p.name+'? This cannot be undone.')){var d=await sb.from('products').delete().eq('id',p.id);if(d.error)return toast(d.error.message);toast('Deleted');load()}};

function openForm(p){editId=p?p.id:null;imgs=p?p.images.slice():[];$('#shT').textContent=p?'Edit product':'Add product';$('#fn').value=p?p.name:'';$('#fp').value=p?p.price:'';$('#fc').value=p?p.category:'shirts';drawImgs();$('#sheet').hidden=false}
$('#new').onclick=function(){openForm(null)};$('#cancel').onclick=function(){$('#sheet').hidden=true};
function drawImgs(){$('#ph').innerHTML=imgs.map(function(u,k){return '<div><img src="'+esc(u)+'" alt=""><button data-m="-1" data-k="'+k+'">‹</button><button data-m="1" data-k="'+k+'">›</button><button data-m="x" data-k="'+k+'">✕</button></div>'}).join('')}
$('#ph').onclick=function(e){var b=e.target.closest('button');if(!b)return;var k=+b.dataset.k,m=b.dataset.m;if(m==='x')imgs.splice(k,1);else{var j=k+ +m;if(j<0||j>=imgs.length)return;var t=imgs[k];imgs[k]=imgs[j];imgs[j]=t}drawImgs()};
$('#addph').onclick=function(){$('#file').click()};
function shrink(f){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var s=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error('Could not read photo'))},'image/jpeg',.8)};im.onerror=function(){rej(new Error('Could not read photo'))};im.src=u})}
$('#file').onchange=async function(){var fs=Array.prototype.slice.call(this.files);this.value='';var b=$('#addph');b.disabled=true;
for(var n=0;n<fs.length;n++){b.textContent='Uploading '+(n+1)+' of '+fs.length+'…';try{var blob=await shrink(fs[n]),path=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
var up=await sb.storage.from('product-images').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});if(up.error)throw up.error;imgs.push(sb.storage.from('product-images').getPublicUrl(path).data.publicUrl);drawImgs()}catch(err){toast('Photo failed: '+err.message)}}
b.disabled=false;b.textContent='+ Add photos'};
$('#save').onclick=async function(){var name=$('#fn').value.trim(),price=parseInt($('#fp').value,10);
if(!name)return toast('Enter a name');if(!(price>0))return toast('Enter a price');if(!imgs.length)return toast('Add at least one photo');
var row={name:name,price:price,category:$('#fc').value,images:imgs},btn=$('#save');btn.disabled=true;
var r=editId?await sb.from('products').update(row).eq('id',editId):await sb.from('products').insert(Object.assign(row,{sort_order:list.reduce(function(m,q){return Math.max(m,q.sort_order)},0)+1}));
btn.disabled=false;if(r.error)return toast(r.error.message);$('#sheet').hidden=true;toast('Saved');load()};

async function stats(){var box=$('#st');box.innerHTML='<div class="card">Loading…</div>';
var since=new Date(Date.now()-30*864e5).toISOString(),ev=[],from=0,r;
do{r=await sb.from('events').select('type,product_id,created_at').gte('created_at',since).order('created_at').range(from,from+999);if(r.error){box.innerHTML='<div class="card">'+esc(r.error.message)+'</div>';return}ev=ev.concat(r.data);from+=1000}while(r.data.length===1000&&from<20000);
var tot=await sb.from('events').select('*',{count:'exact',head:true}).eq('type','view');
var dk=function(d){return new Date(d).toLocaleDateString('en-CA')},per={},tp={};
ev.forEach(function(x){if(x.type==='view')per[dk(x.created_at)]=(per[dk(x.created_at)]||0)+1;else if(x.product_id){var t=tp[x.product_id]=tp[x.product_id]||{tap:0,order:0};t[x.type]++}});
var days=[],w=0,mx=1;for(var i=6;i>=0;i--){var k=dk(Date.now()-i*864e5),v=per[k]||0;w+=v;mx=Math.max(mx,v);days.push([k.slice(5),v])}
var top=Object.keys(tp).map(function(id){var p=list.filter(function(q){return q.id===id})[0];return{n:p?p.name:'Removed item',t:tp[id].tap,o:tp[id].order}}).sort(function(a,b){return b.o-a.o||b.t-a.t}).slice(0,5);
box.innerHTML='<div class="nums"><div class="card"><b>'+(per[dk(Date.now())]||0)+'</b><span>Views today</span></div><div class="card"><b>'+w+'</b><span>Last 7 days</span></div><div class="card"><b>'+(tot.count||0)+'</b><span>All time</span></div></div>'+
'<div class="card"><h3>Views per day</h3>'+days.map(function(d){return '<div class="bar"><em>'+d[0]+'</em><i style="width:'+Math.round(d[1]/mx*100)+'%"></i><span>'+d[1]+'</span></div>'}).join('')+'</div>'+
'<div class="card"><h3>Top products (last 30 days)</h3>'+(top.length?top.map(function(p){return '<div class="tp"><span>'+esc(p.n)+'</span><span>'+p.t+' opened · '+p.o+' orders</span></div>'}).join(''):'<span style="color:#6B645C">Nothing yet. Taps and orders will show up here.</span>')+'</div>'}
</script></body></html>
